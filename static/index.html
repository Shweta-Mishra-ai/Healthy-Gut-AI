<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Gut AI | SEO Article Generator</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Healthy Gut AI</h1>
            <p>Generate precise, medically accurate, and SEO-optimized gut health articles.</p>
            <p><a href="/dashboard" style="opacity:0.7;font-size:0.85rem;">📊 View Dashboard</a> · <a href="/review" style="opacity:0.7;font-size:0.85rem;">✅ Review Queue</a></p>
        </header>

        <section class="generator-panel glass">
            <div class="mode-toggle">
                <button type="button" class="mode-btn active" data-mode="single">Single Article</button>
                <button type="button" class="mode-btn" data-mode="batch">Batch (multiple topics)</button>
            </div>

            <form id="generate-form">
                <div id="single-fields">
                    <div class="form-group">
                        <label for="topic">Article Topic</label>
                        <input type="text" id="topic" name="topic" placeholder="e.g. Irritable Bowel Syndrome" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="primary_keyword">Primary Keyword</label>
                        <input type="text" id="primary_keyword" name="primary_keyword" placeholder="e.g. IBS symptoms" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="geo_target">Geo-Target</label>
                        <input type="text" id="geo_target" name="geo_target" placeholder="e.g. New York, USA" required maxlength="100">
                    </div>
                </div>

                <div id="batch-fields" class="hidden">
                    <div class="form-group">
                        <label for="batch_topics">Topics (one per line, format: topic | keyword | geo)</label>
                        <textarea id="batch_topics" rows="5" placeholder="IBS diet | IBS symptoms | USA
GERD relief | acid reflux remedies | UK"></textarea>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="article_type">Article Type</label>
                        <select id="article_type" name="article_type">
                            <option value="pillar">Pillar (2500+ words)</option>
                            <option value="supporting" selected>Supporting (1000+ words)</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="language">Language</label>
                        <select id="language" name="language">
                            <option value="en" selected>English</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="tone">Tone</label>
                        <select id="tone" name="tone">
                            <option value="educational" selected>Educational</option>
                            <option value="authoritative">Authoritative/Clinical</option>
                            <option value="patient_friendly">Patient-Friendly</option>
                            <option value="academic">Academic</option>
                            <option value="seo_blog">SEO Blog</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="preview-outline-btn" class="btn-primary" style="background:transparent;border:1px solid rgba(255,255,255,0.25);">👁 Preview Outline (free, no generation)</button>
                <div id="outline-preview" class="hidden"></div>

                <button type="submit" id="generate-btn" class="btn-primary">Generate Article</button>
            </form>
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Consulting knowledge base and synthesizing...</p>
            </div>
            <div id="form-error" class="hidden"></div>
        </section>

        <section id="results" class="results-panel glass hidden">
            <!-- Content will be injected here -->
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
