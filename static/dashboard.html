<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Gut AI | Analytics & Quality Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 1.25rem; }
        th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--card-border); font-size: 0.9rem; }
        th { color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <main class="container">
        <header>
            <div class="header-brand">
                <div class="brand-icon">📊</div>
                <h1>System Dashboard</h1>
            </div>
            <p class="subtitle">Real-time metrics, provider distribution, quality scores, and cache performance.</p>
            <div class="nav-links">
                <a href="/">✨ Generator</a>
                <a href="/review">📋 Review Queue</a>
                <a href="/dashboard" class="active">📊 Dashboard</a>
                <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">🌙</button>
            </div>
        </header>

        <section class="generator-panel glass">
            <h3 style="font-family:'Outfit',sans-serif; margin-bottom:1rem; color:var(--text-main);">Performance Overview</h3>
            <div id="dash-summary" class="dash-grid"></div>

            <h3 style="font-family:'Outfit',sans-serif; margin-top:2rem; margin-bottom:0.75rem; color:var(--text-main);">Recent Generations</h3>
            <div style="overflow-x:auto;">
                <table id="dash-table">
                    <thead>
                        <tr>
                            <th>Topic</th>
                            <th>Provider</th>
                            <th>Status</th>
                            <th>Quality</th>
                            <th>Words</th>
                            <th>Cache</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        const themeBtn = document.getElementById('theme-toggle-btn');
        if (themeBtn) {
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
            themeBtn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
            });
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/dashboard/stats?recent=30');
                const data = await res.json();

                const summary = document.getElementById('dash-summary');
                summary.innerHTML = `
                    <div class="dash-card"><h3>${data.total_requests}</h3><p>TOTAL REQUESTS</p></div>
                    <div class="dash-card"><h3>${data.succeeded}</h3><p>SUCCEEDED</p></div>
                    <div class="dash-card"><h3>${data.out_of_scope}</h3><p>OUT OF SCOPE</p></div>
                    <div class="dash-card"><h3>${data.failed}</h3><p>FAILED</p></div>
                    <div class="dash-card"><h3>${data.avg_quality_score}</h3><p>AVG QUALITY</p></div>
                    <div class="dash-card"><h3>${data.avg_word_count}</h3><p>AVG WORDS</p></div>
                    <div class="dash-card"><h3>${data.cache_hit_rate_percent}%</h3><p>CACHE HIT RATE</p></div>
                `;

                const tbody = document.querySelector('#dash-table tbody');
                if (!data.recent.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:2rem 0;">No generations recorded yet. Use the Generator tab to begin.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.recent.map(r => `
                    <tr>
                        <td><strong>${r.topic}</strong></td>
                        <td>${r.provider || '—'}</td>
                        <td><span class="status-pill ${r.success ? 'pill-ok' : 'pill-fail'}">${r.success ? 'OK' : 'Failed'}</span></td>
                        <td>${r.success ? r.quality_score : '—'}</td>
                        <td>${r.success ? r.word_count : '—'}</td>
                        <td>${r.cached ? 'Yes' : 'No'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Dashboard load failed:', err);
            }
        }
        loadDashboard();
    </script>
</body>
</html>
