name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Installed here rather than in requirements.txt, which is also the
      # production build (Render) and doesn't need a linter.
      - name: Lint (ruff)
        run: |
          pip install ruff==0.15.8
          ruff check .

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Import sanity check (mock mode)
        run: python -c "from app.main import app; print('app imported OK, routes:', len(app.routes))"
